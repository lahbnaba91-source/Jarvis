# XcodeGen spec (https://github.com/yonaskolb/XcodeGen) -- generates
# HandTrackerApp.xcodeproj deterministically from this file. Checked in
# instead of the .xcodeproj itself: a hand-maintained .pbxproj is fragile
# (UUID references, easy to corrupt by hand) and this repo's author had no
# way to validate one directly (see README.md's verification-status note).
# CI runs `xcodegen generate` before `pod install`/`xcodebuild` -- see
# .github/workflows/ios-build.yml.
name: HandTrackerApp
options:
  bundleIdPrefix: com.jarvis.handtracker
  deploymentTarget:
    iOS: "16.0"

packages:
  # the actual pipeline code (capture/preprocess/smoothing) -- unchanged,
  # zero third-party deps, lives in ../ (this file's directory) alongside
  # its own Package.swift.
  HandTracker:
    path: .

targets:
  HandTrackerApp:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: HandTracker
        product: HandTracker
      # MediaPipeTasksVision is NOT listed here -- CocoaPods injects it
      # into this generated target via Podfile + `pod install`, which
      # rewrites HandTrackerApp.xcodeproj's build settings and produces
      # HandTrackerApp.xcworkspace. xcodegen must run BEFORE pod install
      # every time (regenerating the .xcodeproj would otherwise wipe the
      # CocoaPods integration).
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "HandTracker needs the camera to track your hand for gesture-based control."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.handtracker.app
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"

# HandTrackerAppTests (a hosted XCTest bundle for App/MediaPipeHandDetector)
# was REMOVED 2026-08-30 after hitting a real, structural wall, not a
# config mistake: Swift's @testable import requires MediaPipeTasksVision
# linked into the test target to even compile, but MediaPipe's native C++
# code registers calculators into a process-wide global registry that
# aborts if initialized twice -- and a hosted test loads BOTH the host
# app's binary and the test bundle into the same process. Confirmed live in
# CI: "Function with name FlowLimiterCalculator already registered", with
# dyld's own "Class X is implemented in both..." warnings naming the app
# binary and the test bundle as the two copies. Tried both standard
# CocoaPods/Xcode remedies (inherit! :search_paths, then TEST_HOST/
# BUNDLE_LOADER) -- each one fixes one side of the conflict and breaks the
# other. This is a known class of problem with C++-global-registry-based
# SDKs under hosted XCTest, not something worth fighting further with
# config. CI now BUILDS this app target (proves CocoaPods + XcodeGen + the
# real MediaPipeHandDetector.swift actually compile/link against the real
# resolved SDK) instead of trying to run tests inside it. The pure-Swift
# HandTracker package's own tests (Tests/HandTrackerTests, zero MediaPipe
# dependency, no double-load risk) are the real automated test coverage.

schemes:
  HandTrackerApp:
    build:
      targets:
        HandTrackerApp: all
