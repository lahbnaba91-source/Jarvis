[project]
name = "jarvis-voice"
version = "0.1.0"
description = "Browser-mic voice line for Jarvis, wired to the ai-visualizer face."
requires-python = ">=3.11,<3.13"
dependencies = [
    "claude-agent-sdk>=0.2.100",
    "faster-whisper>=1.0.0",
    "kokoro>=0.9.0",
    "numpy>=1.26.0",
    "aiohttp>=3.9.0",
    "torch",
]

[tool.uv]
package = false

# faster-whisper/kokoro pull in torch transitively. Left unpinned, uv grabs
# the default CUDA build (~2.5GB with its nvidia-* deps) even though nothing
# here ever uses a GPU -- confirmed 2026-08-29 to nearly fill a fresh
# Codespace's 32GB disk mid-sync. Pinning to the CPU wheel cuts it to ~700MB,
# zero nvidia packages. torch must stay a DIRECT dependency (not just
# transitive via kokoro/faster-whisper) for tool.uv.sources to apply at all
# -- confirmed the override is silently ignored otherwise.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
